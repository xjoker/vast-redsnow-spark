name: 发布镜像

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: arm-image
  cancel-in-progress: false

jobs:
  kernels:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.3.0

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 内核未变则跳过，否则构建并推送
        run: |
          set -euo pipefail
          exl3=$(grep -E '^ARG EXL3_REF=' Dockerfile.kernels | head -1 | cut -d= -f2-)
          base=$(grep -E '^ARG BASE_IMAGE=' Dockerfile.kernels | head -1 | cut -d= -f2-)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/redsnow-kernels:${exl3}"
          echo "EXL3_REF=${exl3}"
          echo "BASE_IMAGE=${base}"
          echo "KERNELS_IMAGE=${image}"
          labels=$(docker buildx imagetools inspect --format '{{json .Image.Config.Labels}}' "$image" 2>/tmp/inspect.err || true)
          if [ -z "${labels}" ] || [ "${labels}" = "null" ]; then
            child=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image" 2>/dev/null | python3 -c '
          import json, sys
          try:
              doc = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          for item in doc.get("manifests") or []:
              platform = item.get("platform") or {}
              if platform.get("os") == "linux" and platform.get("architecture") == "arm64":
                  print(item.get("digest") or "")
                  break
          ' || true)
            if [ -n "${child}" ]; then
              labels=$(docker buildx imagetools inspect --format '{{json .Image.Config.Labels}}' "${image}@${child}" 2>>/tmp/inspect.err || true)
            fi
          fi
          echo "existing labels: ${labels:-<none>}"
          if [ -s /tmp/inspect.err ]; then
            cat /tmp/inspect.err
          fi
          need=1
          if [ -n "${labels}" ] && [ "${labels}" != "null" ]; then
            need=$(python3 -c 'import json,sys; labels=json.loads(sys.argv[1]) or {}; same=labels.get("redsnow.exl3_ref")==sys.argv[2] and labels.get("redsnow.base_image")==sys.argv[3]; print("0" if same else "1")' "${labels}" "${exl3}" "${base}")
          fi
          if [ "${need}" = "0" ]; then
            echo "内核镜像标签未变，跳过构建"
            exit 0
          fi
          echo "=== before build ==="
          df -h
          free -m
          (
            while true; do
              echo "=== monitor $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              free -m || true
              df -h / || true
              uptime || true
              sleep 30
            done
          ) &
          mon=$!
          trap 'kill "$mon" 2>/dev/null || true' EXIT
          docker buildx build \
            --file Dockerfile.kernels \
            --platform linux/arm64 \
            --build-arg "EXL3_REF=${exl3}" \
            --build-arg "BASE_IMAGE=${base}" \
            --tag "$image" \
            --push \
            --provenance=false \
            --sbom=false \
            .

  release:
    needs: kernels
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: 核对当天版本
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          today=$(date -u +%Y%m%d)
          if ! [[ "$version" =~ ^${today}\.[1-9][0-9]*$ ]]; then
            echo "VERSION=${version} 不是今天 UTC ${today} 的 YYYYMMDD.N。当天第一发是 .1，同日再发才递增。"
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: 构建并推送
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          # 基础镜像的层也重压成 zstd：主机拉取时逐层单核解压，gzip 是首次启动最慢的一步。拉取端要 Docker 23+。
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          no-cache: true
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/redsnow-exl3:${{ steps.version.outputs.value }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.value }}
            GIT_COMMIT=${{ github.sha }}
      - name: 打标签
        run: |
          version="${{ steps.version.outputs.value }}"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "标签 v${version} 已存在"
            exit 1
          fi
          git tag "v${version}"
          git push origin "v${version}"
