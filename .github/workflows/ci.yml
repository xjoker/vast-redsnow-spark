name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: 测试
        run: |
          bash -n entrypoint.sh
          bash tests/entrypoint_test.sh
          python3 tests/test_auth_proxy.py
          python3 tests/test_download_model.py
          python3 tests/test_install_easytier.py
          python3 tests/test_normalize_apt_sources.py

  image:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: 读取版本
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: 构建镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          platforms: linux/arm64
          provenance: false
          sbom: false
          build-args: IMAGE_VERSION=${{ steps.version.outputs.value }}
